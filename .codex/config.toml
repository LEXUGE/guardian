default_permissions = "sand"

[features.network_proxy]
enabled = true

[permissions.sand]
extends = ":workspace"

[permissions.sand.filesystem]
# By default, deny read access to all files on disk.
":root" = "deny"

"/nix" = "read"
"/home/ash/.nix-profile/bin" = "read"
"/home/ash/.codex/skills" = "read"
":minimal" = "read"

[permissions.sand.network]
enabled = true
mode = "limited"

[permissions.sand.network.domains]
"api.openai.com" = "allow"

"github.com" = "allow"
"gvisor.dev" = "allow"
"**.crates.io" = "allow"
"docs.rs" = "allow"
