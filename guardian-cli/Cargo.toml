[package]
name = "guardian-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "guardian"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
guardian = { path = "../guardian" }
humantime = "2"
serde_json = "1.0.151"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
uuid = "1.20.0"
