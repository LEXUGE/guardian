[package]
name = "guardian"
version = "0.1.0"
edition = "2024"

[dependencies]
fast-socks5 = "1.0.0"
futures = "0.3"
getrandom = { version = "0.4", features = ["std"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
ipnet = { version = "2.12", features = ["serde"] }
podman-rest-client = { version = "0.13", default-features = false, features = ["uds", "v5"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
toml = "1"
